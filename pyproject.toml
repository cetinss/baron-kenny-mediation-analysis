[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bkmediation"
version = "1.0.0"
description = "Baron-Kenny mediation analysis of caffeine intake, perceived stress and sleep duration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sena Cetin" },
    { name = "Elif Beyza Oztoprak" },
]
keywords = ["mediation", "Baron-Kenny", "bootstrap", "caffeine", "sleep", "stress"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
compare = ["pingouin>=0.5"]

[project.scripts]
bkmediation = "bkmediation.cli:main"

[project.urls]
Repository = "https://github.com/cetinss/baron-kenny-mediation-analysis"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bkmediation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "slow: benchmark and full-bootstrap tests (deselect with -m 'not slow')",
]
